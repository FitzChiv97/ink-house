<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Ink. House</title>
</head>
<body>
    <div class="wrapper">
        <header class="header">
            <div class="header__container container">
                <div class="header__row">
                    <a href="#" class="header__logo">
                        <img src="img/header/logo.svg" alt="logo-icon" class="header__logo-icon">
                        <span class="header__logo-text">Ink. House</span>
                    </a>
                    <nav class="header__menu menu">
                        <ul class="menu__list">
                            <li class="menu__item">
                                <a href="#" class="menu__link">Репродукции</a>
                            </li>
                            <li class="menu__item">
                                <a href="#" class="menu__link">Новинки</a>
                            </li>
                            <li class="menu__item">
                                <a href="#" class="menu__link">О нас</a>
                            </li>
                            <li class="menu__item">
                                <a href="#" class="menu__link menu__link--cart">
                                    <img src="img/header/cart.svg" alt="cart-icon" class="menu__cart-icon">
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </header>
        <main class="main"></main>
        <footer class="footer">
            <div class="container">footer</div>
        </footer>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
